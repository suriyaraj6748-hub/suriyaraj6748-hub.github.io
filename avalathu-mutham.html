<div class="eyebrow">RJ SURYA • தமிழ் கவிதை</div><h1>அவளது முத்தம் — ஒரு தேநீர்க் கோப்பை</h1>
<div class="poem-text">அவளது முத்தத்தைப் பெற்றுவிட்டதால்,

அந்தத் தேநீர்க் கோப்பைக்குக் கூட
ஓர் தெய்வீகம் கிடைத்துவிட்டதோ?

அந்தத் தேநீரும்
தேவாமிர்தமாகிவிட்டதோ...!</div>
<div class="author"><strong>— RJ Surya</strong>Suriyaraj Gunasekaran</div>
